app:
  name: VPSDeck
  host: 127.0.0.1
  port: 8080
  base_url: http://127.0.0.1:8080
  environment: development

security:
  cookie_secure: false
  session_lifetime_hours: 12
  login_rate_limit_per_minute: 5

paths:
  database: ./data/vpsdeck.db
  data_dir: ./data
  log_dir: ./data/logs
  backup_dir: ./data/backups
  apps_dir: ./managed-apps
  simple_mode_roots:
    - ./managed-apps

deployments:
  enabled: true
  git_command: git
  timeout_seconds: 300

reverse_proxy:
  panel_bind_host: 127.0.0.1
  panel_bind_port: 8080
  internal_port_start: 31000
  internal_port_end: 31999
  nginx_sites_available: /etc/nginx/deploynest/sites-available
  nginx_sites_enabled: /etc/nginx/deploynest/sites-enabled
  nginx_bridge_include: /etc/nginx/sites-enabled/vpsdeck-managed.conf
  nginx_command: nginx
  systemctl_command: systemctl

updates:
  enabled: true
  source_dir: .
  branch: main
  git_command: git
  check_interval_minutes: 30

monitoring:
  refresh_seconds: 5

  ports:
    enabled: true

  ollama:
    enabled: true
    base_url: http://127.0.0.1:11434
    timeout_seconds: 2

docker:
  enabled: true
  discovery_enabled: true
  command: docker
  timeout_seconds: 10
